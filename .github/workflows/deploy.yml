name: 測試、建置並發布到 GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 預設只給讀取權限；發布到 Pages 需要的權限只給下面的 deploy 工作
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # 同一個分支又推了新版本：還在測試、建置的舊版直接取消
    concurrency:
      group: build-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: 上傳網站檔案
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    # 發布到一半不要取消（網站可能停在一半的狀態）；排隊中的舊版會被更新的版本取代
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
